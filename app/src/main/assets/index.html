<!doctype html><html lang="uz"><meta name="viewport" content="width=device-width,initial-scale=1"><meta charset="utf-8"><title>TLO Logistics</title><style>body{background:#111;color:white;font:16px Arial;margin:0}header{background:#24191d;padding:24px;border-bottom:3px solid #e52b42}h1{margin:0}b{color:#f34}main{padding:18px}section{background:#24242a;border-radius:12px;padding:16px;margin:12px 0}input,select,button{box-sizing:border-box;width:100%;padding:13px;margin:6px 0;border-radius:8px;border:0;font-size:16px}input,select{background:#37373e;color:white}button{background:#e52b42;color:white;font-weight:bold}.item{border-top:1px solid #555;padding:12px 0}.muted{color:#bbb;font-size:13px}</style><header><h1>TLO <b>LOGISTICS</b></h1><small>Android sinov ilovasi</small></header><main><section><h3>Yangi buyurtma</h3><form id="f"><input name="client" required placeholder="Mijoz ismi"><input name="phone" required placeholder="Telefon"><input name="address" required placeholder="Manzil"><input name="courier" required placeholder="Kuryer"><input name="amount" type="number" min="0" required placeholder="Summa (so‘m)"><select name="payment"><option value="Naqd">Naqd</option><option value="Karta">Karta</option></select><button>Buyurtma qo‘shish</button></form></section><section><h3>Hisobot</h3><div id="stats"></div></section><section><h3>Buyurtmalar</h3><div id="list"></div></section><p class="muted">Sinov versiyasi: ma’lumotlar faqat shu qurilmada saqlanadi. Server va Telegram ulanmagan.</p></main><script>let a=[];try{a=JSON.parse(localStorage.getItem('tlo_orders')||'[]')}catch(e){};function esc(x){return String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}function save(){localStorage.setItem('tlo_orders',JSON.stringify(a));render()}document.getElementById('f').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);a.unshift({id:Date.now(),client:f.get('client'),phone:f.get('phone'),address:f.get('address'),courier:f.get('courier'),amount:Number(f.get('amount')),payment:f.get('payment'),status:'Yangi'});e.target.reset();save()};function status(id,s){let o=a.find(x=>x.id===id);if(o){o.status=s;save()}}function render(){let done=a.filter(x=>x.status==='Yetkazildi');let sum=p=>done.filter(x=>x.payment===p).reduce((s,x)=>s+x.amount,0).toLocaleString('ru-RU');document.getElementById('stats').textContent='Jami: '+a.length+' | Yetkazildi: '+done.length+' | Naqd: '+sum('Naqd')+' so‘m | Karta: '+sum('Karta')+' so‘m';document.getElementById('list').innerHTML=a.map(x=>'<div class="item"><strong>'+esc(x.client)+'</strong> — '+esc(x.status)+'<p>'+esc(x.address)+'<br>'+esc(x.phone)+'<br>Kuryer: '+esc(x.courier)+'<br>'+x.amount.toLocaleString('ru-RU')+' so‘m / '+esc(x.payment)+'</p>'+(x.status==='Yangi'?'<button onclick="status('+x.id+',\'Yo‘lda\')">Yo‘lga chiqdi</button>':'')+(x.status==='Yo‘lda'?'<button onclick="status('+x.id+',\'Yetkazildi\')">Yetkazildi</button>':'')+'</div>').join('')||'Hozircha buyurtma yo‘q'}render();</script></html>
