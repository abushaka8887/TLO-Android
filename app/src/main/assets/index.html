<!doctype html><html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TLO Logistics</title><style>
*{box-sizing:border-box}body{margin:0;background:#0b0e17;color:#eef0f7;font:16px system-ui,Arial}header{padding:22px;background:#1b1118;border-bottom:3px solid #e53945}h1{margin:0}h1 span{color:#f04450}nav{display:flex;position:sticky;top:0;background:#171d2b;z-index:2;overflow:auto}nav button{flex:1;min-width:100px;border:0;border-bottom:3px solid transparent;border-radius:0;background:transparent;color:#d4d6de;padding:14px 6px;font-size:13px}nav button.active{border-color:#f04450;color:white}main{padding:15px;max-width:750px;margin:auto}.panel{background:#171d2b;border:1px solid #31394b;border-radius:16px;padding:16px;margin-bottom:14px}input,select,button{width:100%;padding:12px;margin:5px 0;border-radius:9px;border:1px solid #3a4355;font:inherit}input,select{background:#101624;color:white}button{background:#e53945;color:white;font-weight:700;border:0}button.secondary{background:#303a50}h2{font-size:21px}h3{margin:4px 0 12px}.muted{color:#9ca6b9;font-size:13px}.item{border-top:1px solid #3a4355;padding:13px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;border-radius:10px;background:#252e42}.stat strong{display:block;font-size:23px}.hide{display:none}.tiny{font-size:12px}
 .company-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.company-card{margin:0;background:#f9fafc;color:#182032}.company-card .muted{color:#58657a}.company-card .stock{background:#e9edf4;border-radius:12px;padding:12px;margin:12px 0}.company-card button{font-size:13px;padding:12px 7px}.company-card button.secondary{background:#e4e8ef;color:#253047} .status-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:14px}.status-tile{background:#202838;border:1px solid #475168;text-align:left;padding:12px}.status-tile strong{display:block;font-size:23px}.status-tile small{font-size:11px}.status-tile.chosen{border:2px solid #f04450}.filters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.filters select{font-size:12px;padding:8px 2px}@media(min-width:700px){.status-grid{grid-template-columns:repeat(6,1fr)}} .courier-row{display:grid;grid-template-columns:70px 1fr 95px;align-items:center;gap:8px}.courier-row button{font-size:12px;padding:8px 3px}.courier-row span{font-size:13px;color:#aeb7c7}.courier-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin:12px 0 20px}.courier-card{border:1px solid #3a4355;background:#222b3c;padding:14px;border-radius:14px}.courier-card h3{font-size:23px}.courier-card div{font-size:13px;margin:5px 0}.courier-card strong{display:block;margin-top:12px}.green{color:#47c98d}.summary-line{display:flex;justify-content:space-between;gap:12px;border-bottom:1px dotted #465068;padding:9px 0}.excel-overlay{position:fixed;inset:0;background:#000b;z-index:9999;display:flex;justify-content:center;align-items:center;padding:15px}.excel-modal{background:#182238;color:white;max-width:620px;width:100%;max-height:90vh;overflow:auto;border-radius:16px;padding:20px}.excel-products{display:flex;flex-wrap:wrap;gap:12px}.excel-products label{background:#3448a6;padding:10px;border-radius:10px}.excel-products input{width:auto}.excel-warning{background:#5b420d;padding:12px;border-radius:10px}</style></head><body><header><h1>TLO <span>LOGISTICS</span></h1><div class="muted">Toshkent • Android sinov versiyasi</div></header><nav id="nav"></nav><main id="main"></main><script>
const tabs=['Buyurtmalar','Kompaniyalar','Kuryerlar','Arxiv','Hisobot','Sozlamalar'];let tab=0;
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let courierRegions=load('tlo_courier_regions',{});let settings=load('tlo_settings',{withheld:80000,courierShare:30000,appearance:'auto',signal:true,keepAwake:false});let archiveStart='',archiveEnd='',archiveQuery='';let selectedImportCompany='';let orderFilter='Hammasi',searchTerm='',companyFilter='',regionFilter='',courierFilter='';let orders=load('tlo_orders',[]),companies=load('tlo_companies',[]),couriers=load('tlo_couriers',['T-1','T-2','T-3','T-4','TV-1','TV-2','TV-3']);
const save=()=>{localStorage.setItem('tlo_settings',JSON.stringify(settings));localStorage.setItem('tlo_orders',JSON.stringify(orders));localStorage.setItem('tlo_companies',JSON.stringify(companies));localStorage.setItem('tlo_couriers',JSON.stringify(couriers));localStorage.setItem('tlo_courier_regions',JSON.stringify(courierRegions));render()};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c]));
const fmt=x=>Number(x||0).toLocaleString('ru-RU');
const options=(a,placeholder)=>'<option value="">'+placeholder+'</option>'+a.map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');
const fields='<input name="client" required placeholder="Mijoz ismi"><input name="phone" required placeholder="Telefon"><input name="address" required placeholder="Manzil"><input name="amount" type="number" min="0" required placeholder="Summa (so‘m)"><select name="payment"><option>Naqd</option><option>Karta</option></select>';
function addOrder(e){e.preventDefault();if(settings.signal)testSignal();let f=new FormData(e.target);orders.unshift({id:Date.now()+Math.random(),date:new Date().toISOString(),client:f.get('client'),phone:f.get('phone'),address:f.get('address'),amount:Number(f.get('amount')),payment:f.get('payment'),company:f.get('company')||'',courier:f.get('courier')||'',status:f.get('courier')?'Berilgan':'Berilmagan'});save()}
function addCompany(e){e.preventDefault();let n=e.target.elements.namedItem('name').value.trim();if(n&&!companies.includes(n))companies.push(n);save()}
function addCourier(e){e.preventDefault();let n=e.target.elements.namedItem('name').value.trim();if(n&&!couriers.includes(n))couriers.push(n);save()}
function editCourier(i){const old=couriers[i];const name=prompt('Kuryer ismi yoki kodi:',old);if(name===null)return;const next=name.trim();if(!next){alert('Kuryer nomi bo‘sh bo‘lmasin');return}if(next!==old&&couriers.includes(next)){alert('Bu kuryer mavjud');return}const region=prompt('Hudud (masalan, Toshkent shahri yoki Toshkent viloyati):',courierRegions[old]||(old.startsWith('TV-')?'Toshkent viloyati':'Toshkent shahri'));if(region===null)return;couriers[i]=next;courierRegions[next]=region.trim();if(next!==old){delete courierRegions[old];orders.forEach(o=>{if(o.courier===old)o.courier=next})}save()}
function addCourierFromSettings(){const name=prompt('Yangi kuryer kodi yoki ismi:');if(name===null)return;const n=name.trim();if(!n||couriers.includes(n)){alert('Nom bo‘sh yoki avval kiritilgan');return}const region=prompt('Kuryer hududi:','Toshkent shahri');if(region===null)return;couriers.push(n);courierRegions[n]=region.trim();save()}
function saveSettings(e){e.preventDefault();const f=new FormData(e.target),withheld=Number(f.get('withheld')),courierShare=Number(f.get('courierShare'));if(!Number.isFinite(withheld)||!Number.isFinite(courierShare)||withheld<0||courierShare<0||courierShare>withheld){alert('Ulushlarni tekshiring: kuryer ulushi ushlab qolinadigan summadan oshmasin');return}settings.withheld=withheld;settings.courierShare=courierShare;save();alert('Standart ulushlar saqlandi')}
function updateToggle(k,v){settings[k]=v;save();if(k==='keepAwake'&&window.TLOAndroid&&TLOAndroid.setKeepAwake)TLOAndroid.setKeepAwake(v)}
function testSignal(){if(!settings.signal){alert('Signal o‘chirilgan');return}if(window.TLOAndroid&&TLOAndroid.playSignal){TLOAndroid.playSignal()}else{alert('Ovozli signal Android ilovasida ishlaydi')}}
function exportToday(){const today=new Date().toLocaleDateString('en-CA');const todayOrders=orders.filter(o=>['Topshirildi','Bekor'].includes(o.status)&&String(o.completedAt||'').slice(0,10)===today);exportCSV(todayOrders,'TLO-kunlik-hisobot-'+today+'.csv')}
function setAppearance(v){settings.appearance=v;save()}
function changeStatus(id,s){let o=orders.find(x=>String(x.id)===String(id));if(o){o.status=s;if(s==='Topshirildi'){o.withheld=Number(settings.withheld);o.courierShare=Number(settings.courierShare);o.serviceShare=o.withheld-o.courierShare;}if(['Topshirildi','Bekor'].includes(s))o.completedAt=new Date().toISOString();save()}}
function assign(id,val){let o=orders.find(x=>String(x.id)===String(id));if(o){o.courier=val;o.status=val?'Berilgan':'Berilmagan';save()}}
function csvCell(x){return '"'+String(x??'').replace(/"/g,'""')+'"'}
function exportCSV(source=orders,filename='TLO-buyurtmalar.csv'){let rows=[['ID','Sana','Kompaniya','Mijoz','Telefon','Manzil','Summa','Tolov','Kuryer','Holat'],...source.map(x=>[x.externalId||x.id,x.date,x.company,x.client,x.phone,x.address,x.amount,x.payment,x.courier,x.status])];let blob=new Blob(['\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n')],{type:'text/csv;charset=utf-8'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function template(){let blob=new Blob(['\uFEFFKompaniya,Mijoz,Telefon,Manzil,Summa,Tolov,Kuryer\r\n'],{type:'text/csv'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TLO-namuna.csv';a.click()}
function parseCSV(t){let out=[],r=[],v='',q=false;for(let i=0;i<t.length;i++){let c=t[i];if(c==='"'){if(q&&t[i+1]==='"'){v+='"';i++}else q=!q}else if(c===','&&!q){r.push(v);v=''}else if((c==='\n'||c==='\r')&&!q){if(c==='\r'&&t[i+1]==='\n')i++;r.push(v);if(r.some(x=>x.trim()))out.push(r);r=[];v=''}else v+=c}r.push(v);if(r.some(x=>x.trim()))out.push(r);return out}
async function importCSV(el){let f=el.files[0];if(!f)return;let rows=parseCSV((await f.text()).replace(/^\uFEFF/,''));let headers=rows.shift().map(x=>x.trim().toLowerCase());let key=['kompaniya','mijoz','telefon','manzil','summa','tolov','kuryer'];if(!key.every(x=>headers.includes(x))){alert('CSV ustunlari mos emas. Namuna fayldan foydalaning.');return}let added=0;for(let r of rows){let d=Object.fromEntries(key.map(k=>[k,r[headers.indexOf(k)]||'']));if(!d.mijoz||!d.telefon||!d.manzil||!Number.isFinite(Number(d.summa)))continue;orders.unshift({id:Date.now()+Math.random(),date:new Date().toISOString(),company:d.kompaniya,client:d.mijoz,phone:d.telefon,address:d.manzil,amount:Number(d.summa),payment:/karta/i.test(d.tolov)?'Karta':'Naqd',courier:d.kuryer,status:d.kuryer?'Berilgan':'Berilmagan'});if(d.kompaniya&&!companies.includes(d.kompaniya))companies.push(d.kompaniya);added++}save();alert(added+' ta buyurtma yuklandi')}

let pendingExcelRows=null;
let selectedProductColumns=[];
function importExcelRows(rows){
 if(!Array.isArray(rows)||rows.length<2){alert('Excel bo‘sh yoki buyurtmalar topilmadi');return 'ERROR: empty'}
 pendingExcelRows=rows;
 const h=rows[0].map(x=>String(x??'').trim().toUpperCase());
 selectedProductColumns=['Fitvay',"Sovg'a",'Kasha power fuel','WitoWay'].filter(x=>h.includes(x.toUpperCase()));
 showExcelPreview();
 return 'PREVIEW';
}
function toggleProductColumn(name,checked){selectedProductColumns=checked?[...new Set([...selectedProductColumns,name])]:selectedProductColumns.filter(x=>x!==name);showExcelPreview()}
function cancelExcelPreview(){pendingExcelRows=null;document.getElementById('excelPreviewOverlay')?.remove()}
function confirmExcelImport(){if(!pendingExcelRows)return;const rows=pendingExcelRows;cancelExcelPreview();commitExcelRows(rows)}
function showExcelPreview(){
 document.getElementById('excelPreviewOverlay')?.remove();
 if(!pendingExcelRows)return;
 const rows=pendingExcelRows,h=rows[0].map(x=>String(x??'').trim().toUpperCase());
 const get=(r,k)=>String(r[h.indexOf(k)]??'').trim();
 const entries=rows.slice(1).filter(r=>get(r,'ID RAQAM')||get(r,'MIJOZ ISMI')||get(r,'MANZIL'));
 const outside=entries.filter(r=>{const v=get(r,'VILOYAT').toUpperCase();return v&&!v.includes('TOSHKENT')&&!v.includes('ТАШКЕНТ')});
 const eligible=entries.filter(r=>!outside.includes(r));
 const modal=document.createElement('div');modal.id='excelPreviewOverlay';modal.className='excel-overlay';
 const productNames=['Fitvay',"Sovg'a",'Kasha power fuel','WitoWay'].filter(x=>h.includes(x.toUpperCase()));
 modal.innerHTML='<div class="excel-modal"><button class="secondary" style="float:right" onclick="cancelExcelPreview()">✕</button><h2>Excel yuklashdan oldin tekshirish</h2><p>'+esc(selectedImportCompany||'Barcha kompaniyalar')+' • '+entries.length+' ta buyurtma topildi</p><label>Varaq<select><option>BUYURTMALAR</option></select></label><h3>Mahsulot ustunlari</h3><div class="excel-products">'+productNames.map(n=>'<label><input type="checkbox" '+(selectedProductColumns.includes(n)?'checked':'')+' onchange="toggleProductColumn(\''+n.replace(/'/g,"\\'")+'\',this.checked)"> '+esc(n)+'</label>').join('')+'</div><p class="muted">Belgilangan ustunlar mahsulot miqdori sifatida olinadi.</p><h3>Namuna</h3><p>'+eligible.length+' ta mos hududdagi buyurtma</p>'+(outside.length?'<p class="excel-warning">'+outside.length+' ta boshqa hududdagi buyurtma bor. Ular yuklanmaydi.</p>':'')+eligible.slice(0,5).map(r=>'<div class="item"><strong>'+esc(get(r,'MIJOZ ISMI'))+'</strong> '+esc(get(r,'MIJOZ RAQAMI 1'))+'<p>'+esc(get(r,'VILOYAT'))+', '+esc(get(r,'MANZIL'))+'<br>'+selectedProductColumns.filter(n=>Number(get(r,n))>0).map(n=>esc(n)+' ×'+Number(get(r,n))).join(', ')+' • '+esc(get(r,'SUMMASI'))+' so‘m</p></div>').join('')+'<div class="grid"><button class="secondary" onclick="cancelExcelPreview()">Bekor qilish</button><button onclick="confirmExcelImport()">'+eligible.length+' ta buyurtmani yuklash</button></div></div>';
 document.body.appendChild(modal);
}
function commitExcelRows(rows){
 try{
 if(!Array.isArray(rows)||rows.length<2){alert('Excel bo‘sh yoki buyurtmalar topilmadi');return 'ERROR: Excel bo‘sh'}
 const norm=x=>String(x??'').trim().toLocaleUpperCase();
 const h=rows[0].map(norm);
 const required=['ID RAQAM','MIJOZ ISMI','VILOYAT','MANZIL','SUMMASI'];
 if(!required.every(x=>h.includes(x))){alert('Excel ustunlari mos emas: '+required.filter(x=>!h.includes(x)).join(', '));return}
 const get=(r,k)=>String(r[h.indexOf(k)]??'').trim();
 let added=0,duplicate=0,skipped=0;
 for(const r of rows.slice(1)){
  const id=get(r,'ID RAQAM'),client=get(r,'MIJOZ ISMI'),address=get(r,'MANZIL');
  if(!id&&!client&&!address)continue;
  if(!id||!client||!address){skipped++;continue}
  const regionCheck=get(r,'VILOYAT').toUpperCase();if(regionCheck&&!regionCheck.includes('TOSHKENT')&&!regionCheck.includes('ТАШКЕНТ')){skipped++;continue}
  if(orders.some(o=>String(o.externalId||'')===id)){duplicate++;continue}
  const amount=Number(get(r,'SUMMASI').replace(/\\s/g,'').replace(',','.'));
  if(!Number.isFinite(amount)||amount<0){skipped++;continue}
  const phones=['MIJOZ RAQAMI 1','MIJOZ RAQAMI 2','MIJOZ RAQAMI 3'].map(k=>get(r,k)).filter(Boolean);
  const products=selectedProductColumns.map(k=>({name:k,qty:Number(get(r,k))||0})).filter(p=>p.qty>0);
  const region=get(r,'VILOYAT'),district=get(r,'SHAHAR YOKI TUMAN'),specialist=get(r,'MUTAXASSIS');
  orders.unshift({id:Date.now()+Math.random(),externalId:id,date:new Date().toISOString(),client,phone:phones[0]||'',phones,address:[region,district,address].filter(Boolean).join(', '),region,district,products,specialist,amount,payment:'Naqd',company:selectedImportCompany||'',courier:'',status:'Berilmagan',withheld:Number(settings.withheld),courierShare:Number(settings.courierShare)});
  added++;
 }
 save();alert(added+' ta buyurtma yuklandi. Takroriy: '+duplicate+'. O‘tkazib yuborildi: '+skipped+'.');return 'OK: '+added;
 }catch(e){alert('Excel import xatosi: '+e.message);return 'ERROR: '+e.message}
}
function chooseExcel(company=''){selectedImportCompany=company;try{if(window.TLOAndroid&&typeof window.TLOAndroid.chooseExcel==='function'){window.TLOAndroid.chooseExcel()}else{alert('Android fayl tanlash xizmati ulanmagan. Yangi APKni o‘rnating.')}}catch(e){alert('Excel tanlash xatosi: '+e.message)}}

function autoAssign(){const pool=couriers.filter(Boolean);if(!pool.length){alert('Avval kuryer qo‘shing');return}let n=0;const loads=Object.fromEntries(pool.map(c=>[c,orders.filter(o=>o.courier===c&&!['Topshirildi','Bekor'].includes(o.status)).length]));for(const o of orders){if(o.status==='Berilmagan'&&!o.courier){const c=pool.slice().sort((a,b)=>loads[a]-loads[b])[0];o.courier=c;o.status='Berilgan';loads[c]++;n++}}save();alert(n+' ta buyurtma kuryerlarga taqsimlandi. Hudud va marshrut bo‘yicha optimallashtirish hali qo‘shilmagan.')}
function setOrderFilter(v){orderFilter=v;render()}
function setSearch(v){searchTerm=v;render();const el=document.getElementById('orderSearch');if(el){el.focus();el.setSelectionRange(v.length,v.length)}}
function orderItem(o){return '<div class="item"><strong>#'+esc(o.externalId||String(o.id).slice(-6))+' • '+esc(o.client)+'</strong><div class="muted">'+esc(o.company)+' • '+esc(o.status)+'</div><p>'+esc(o.phone)+'<br>'+esc(o.address)+(o.products&&o.products.length?'<br>Mahsulot: '+o.products.map(p=>esc(p.name)+' × '+p.qty).join(', '):'')+(o.specialist?'<br>Mutaxassis: '+esc(o.specialist):'')+'<br>'+fmt(o.amount)+' so‘m / '+esc(o.payment)+'</p><select onchange="assign(\''+o.id+'\',this.value)">'+options(couriers,'Kuryer tanlang').replace('value="'+esc(o.courier)+'"','value="'+esc(o.courier)+'" selected')+'</select><div class="grid"><button class="secondary" onclick="changeStatus(\''+o.id+'\',\'Yo‘lda\')">Yo‘lda</button><button onclick="changeStatus(\''+o.id+'\',\'Topshirildi\')">Topshirildi</button></div><button class="secondary" onclick="changeStatus(\''+o.id+'\',\'Bekor\')">Bekor qilish</button></div>'}
function render(){document.getElementById('nav').innerHTML=tabs.map((t,i)=>'<button class="'+(i===tab?'active':'')+'" onclick="tab='+i+';render()">'+t+'</button>').join('');let active=orders.filter(x=>!['Topshirildi','Bekor'].includes(x.status)),done=orders.filter(x=>x.status==='Topshirildi'),cancel=orders.filter(x=>x.status==='Bekor'),m=document.getElementById('main');
if(tab===0){
const filtered=orders.filter(o=>(orderFilter==='Hammasi'||o.status===orderFilter)&&(!companyFilter||o.company===companyFilter)&&(!courierFilter||o.courier===courierFilter)&&(!regionFilter||(o.region||o.address||'').includes(regionFilter))&&(!searchTerm||[o.externalId,o.id,o.client,o.phone,o.address].some(v=>String(v||'').toLowerCase().includes(searchTerm.toLowerCase()))));
const regions=[...new Set(orders.map(o=>o.region).filter(Boolean))];
const counts=['Berilmagan','Berilgan','Yo‘lda','Topshirildi','Bekor','Hammasi'];
m.innerHTML='<h2>Buyurtmalar</h2><div class="panel"><div class="grid"><button onclick="document.getElementById(\'newOrderForm\').classList.toggle(\'hide\')">+ Qo‘shish</button><button class="secondary" onclick="autoAssign()">Avto taqsimlash</button></div><button class="secondary" onclick="exportCSV()">Hisobot CSV</button></div>'+
'<div class="status-grid">'+counts.map(t=>'<button class="status-tile '+(orderFilter===t?'chosen':'')+'" onclick="setOrderFilter(\''+t+'\')"><strong>'+(t==='Hammasi'?orders.length:orders.filter(o=>o.status===t).length)+'</strong><small>'+t+'</small></button>').join('')+'</div>'+
'<div class="panel"><input id="orderSearch" placeholder="Ism, telefon, manzil yoki №" value="'+esc(searchTerm)+'" oninput="setSearch(this.value)"><div class="filters"><select onchange="companyFilter=this.value;render()">'+options(companies,'Barcha kompaniyalar').replace('value="'+esc(companyFilter)+'"','value="'+esc(companyFilter)+'" selected')+'</select><select onchange="regionFilter=this.value;render()">'+options(regions,'Barcha hududlar').replace('value="'+esc(regionFilter)+'"','value="'+esc(regionFilter)+'" selected')+'</select><select onchange="courierFilter=this.value;render()">'+options(couriers,'Barcha kuryerlar').replace('value="'+esc(courierFilter)+'"','value="'+esc(courierFilter)+'" selected')+'</select></div></div>'+
'<div id="newOrderForm" class="panel hide"><h3>Yangi buyurtma</h3><form onsubmit="addOrder(event)"><select name="company">'+options(companies,'Kompaniya tanlang')+'</select>'+fields+'<select name="courier">'+options(couriers,'Kuryer (ixtiyoriy)')+'</select><button>Buyurtma qo‘shish</button></form></div>'+
'<div class="panel"><h3>Excel (.xlsx) / CSV yuklash</h3><button onclick="chooseExcel()">Excel (.xlsx) fayl yuklash</button><p class="muted">BUYURTMALAR varag‘idan ma’lumotlar olinadi. Takroriy IDlar o‘tkazib yuboriladi.</p><button class="secondary" onclick="template()">Namuna CSV olish</button><input type="file" accept=".csv,text/csv" onchange="importCSV(this)"></div>'+
'<div class="panel"><h3>'+filtered.length+' ta buyurtma</h3>'+(filtered.length?filtered.map(orderItem).join(''):'Buyurtmalar ro‘yxati bo‘sh')+'</div>';
}
if(tab===1)m.innerHTML='<h2>Kompaniyalar</h2><div class="panel"><form onsubmit="addCompany(event)"><input name="name" required placeholder="Kompaniya nomi"><button>+ Kompaniya qo‘shish</button></form></div><div class="company-grid">'+companies.map((c,i)=>'<div class="panel company-card"><h3>'+esc(c)+'</h3><p class="muted">'+orders.filter(x=>x.company===c).length+' ta buyurtma</p><div class="stock"><strong>Mahsulotlar / Sklad</strong><p class="muted">Mahsulot qoldig‘i keyingi bosqichda ulanadi</p></div><div class="grid"><button onclick="chooseExcel(companies['+i+'])">Excel yuklash</button><button class="secondary" onclick="tab=0;render()">Qo‘lda kiritish</button></div><button class="secondary" onclick="template()">Namuna Excel / CSV</button></div>').join('')+'</div>';
if(tab===2){
 const today=new Date().toLocaleDateString('en-CA');
 const isToday=o=>String(o.completedAt||'').slice(0,10)===today;
 const delivered=orders.filter(o=>o.status==='Topshirildi'&&isToday(o));
 const cancelled=orders.filter(o=>o.status==='Bekor'&&isToday(o));
 const inHand=orders.filter(o=>o.courier&&!['Topshirildi','Bekor'].includes(o.status));
 const totalCash=delivered.filter(o=>o.payment==='Naqd').reduce((sum,o)=>sum+Number(o.amount||0),0);
 const courierCard=c=>{const activeCount=inHand.filter(o=>o.courier===c).length;const completed=delivered.filter(o=>o.courier===c);const cash=completed.filter(o=>o.payment==='Naqd').reduce((sum,o)=>sum+Number(o.amount||0),0);return '<div class="courier-card"><h3>'+esc(c)+'</h3><div>'+activeCount+' faol</div><div class="green">'+completed.length+' topshirdi</div><strong>'+fmt(cash)+' so‘m</strong></div>'};
 const groups=['Toshkent shahri','Toshkent viloyati'];
 m.innerHTML='<h2>Kuryerlar</h2><p class="muted">'+couriers.length+' ta kuryer, Toshkent shahri va viloyati</p><div class="panel"><div class="summary-line"><span>Bugun topshirildi</span><strong>'+delivered.length+' ta</strong></div><div class="summary-line"><span>Bugun bekor qilindi</span><strong>'+cancelled.length+' ta</strong></div><div class="summary-line"><span>Kuryerlar qo‘lida</span><strong>'+inHand.length+' ta</strong></div><div class="summary-line"><span>Yig‘ilgan naqd pul (bugun)</span><strong>'+fmt(totalCash)+' so‘m</strong></div></div>'+groups.map(g=>'<h3>'+g+'</h3><div class="courier-cards">'+couriers.filter(c=>(courierRegions[c]||(c.startsWith('TV-')?'Toshkent viloyati':'Toshkent shahri'))===g).map(courierCard).join('')+'</div>').join('')+'<div class="panel"><form onsubmit="addCourier(event)"><input name="name" required placeholder="Kuryer ismi yoki kodi"><button>+ Kuryer qo‘shish</button></form></div>';
}
if(tab===3){
const archived=orders.filter(o=>['Topshirildi','Bekor'].includes(o.status));
const results=archived.filter(o=>{
const date=String(o.completedAt||o.date||'').slice(0,10);
const q=archiveQuery.trim().toLowerCase();
return (!archiveStart||date>=archiveStart)&&(!archiveEnd||date<=archiveEnd)&&(!q||[o.externalId,o.id,o.client,o.phone,...(o.phones||[]),o.address,o.specialist,o.company,o.courier].some(v=>String(v||'').toLowerCase().includes(q)));
});
window.exportArchive=function(){exportCSV(results,'TLO-arxiv.csv')};
m.innerHTML='<h2>Arxiv</h2><p class="muted">Topshirilgan va bekor qilingan buyurtmalar</p><div class="panel"><p class="muted">Sanalarni tanlang yoki ID, mutaxassis, telefon, manzil orqali qidiring.</p><div class="grid"><label>Boshlanish<input type="date" value="'+esc(archiveStart)+'" onchange="archiveStart=this.value;render()"></label><label>Tugash<input type="date" value="'+esc(archiveEnd)+'" onchange="archiveEnd=this.value;render()"></label></div><input id="archiveSearch" placeholder="ID, mutaxassis, telefon, manzil..." value="'+esc(archiveQuery)+'" oninput="archiveQuery=this.value"><div class="grid"><button onclick="render()">Qidirish</button><button class="secondary" onclick="exportArchive()">Excel uchun CSV yuklash</button></div><p class="muted">'+results.length+' ta buyurtma topildi</p>'+(results.length?results.map(orderItem).join(''):'<p class="muted">Bu sana va filtrda yakunlangan buyurtma yo‘q.</p>')+'</div>';
}
if(tab===4)m.innerHTML='<h2>Hisobot</h2><div class="panel"><div class="grid"><div class="stat"><strong>'+orders.length+'</strong>Jami buyurtma</div><div class="stat"><strong>'+done.length+'</strong>Topshirildi</div><div class="stat"><strong>'+fmt(done.filter(x=>x.payment==='Naqd').reduce((s,x)=>s+x.amount,0))+'</strong>Naqd so‘m</div><div class="stat"><strong>'+fmt(done.filter(x=>x.payment==='Karta').reduce((s,x)=>s+x.amount,0))+'</strong>Karta so‘m</div></div><button onclick="exportCSV()">Hisobot CSV yuklash</button></div>';
if(tab===5)m.innerHTML='<h2>Sozlamalar</h2><div class="panel"><h3>Standart ulushlar</h3><p class="muted">Yangi buyurtmalar uchun standart. Hisob-kitob faqat topshirilgan buyurtmalarga qo‘llanadi.</p><form onsubmit="saveSettings(event)"><label>Ushlab qolinadi, so‘m<input type="number" min="0" name="withheld" value="'+settings.withheld+'" required></label><label>Kuryer ulushi, so‘m<input type="number" min="0" name="courierShare" value="'+settings.courierShare+'" required></label><p>Xizmatga: <strong>'+fmt(settings.withheld-settings.courierShare)+' so‘m</strong></p><button>Saqlash</button></form></div><div class="panel"><h3>Ko‘rinish</h3><div class="grid">'+['auto','light','dark'].map((v,i)=>'<button class="'+(settings.appearance===v?'':'secondary')+'" onclick="setAppearance(\''+v+'\')">'+['Avtomatik','Kunduzgi','Tungi'][i]+'</button>').join('')+'</div><p class="muted">Ko‘rinish tanlovi saqlanadi. Rang rejimlarini to‘liq qo‘llash keyingi yangilanishda.</p></div><div class="panel"><h3>Signal</h3><label><input type="checkbox" style="width:auto" '+(settings.signal?'checked':'')+' onchange="updateToggle(&quot;signal&quot;,this.checked)"> Yangi buyurtma kelganda signal bersin</label><button class="secondary" onclick="testSignal()">Sinab ko‘rish</button><label><input type="checkbox" style="width:auto" '+(settings.keepAwake?'checked':'')+' onchange="updateToggle(&quot;keepAwake&quot;,this.checked)"> Ekran o‘chmasin</label></div><div class="panel"><h3>Kunlik hisobot</h3><p class="muted">Bugun yakunlangan buyurtmalarni Excel uchun CSV formatida yuklash.</p><button onclick="exportToday()">Bugungi hisobotni yuklash</button></div><div class="panel"><h3>Ro‘yxat</h3><p class="muted">Yakunlangan buyurtmalar Arxivda saqlanadi va sanasi bo‘yicha topiladi.</p></div><div class="panel"><h3>Kuryerlar va loginlar</h3><p class="muted">Kuryer ma’lumotlarini tahrirlash mumkin. Login va parol orqali kirish server qo‘shilgach ishlaydi.</p>'+couriers.map((c,i)=>'<div class="item courier-row"><strong>'+esc(c)+'</strong><span>'+esc(courierRegions[c]||(c.startsWith('TV-')?'Toshkent viloyati':'Toshkent shahri'))+'</span><button class="secondary" onclick="editCourier('+i+')">Tahrirlash</button></div>').join('')+'<button class="secondary" onclick="addCourierFromSettings()">+ Kuryer qo‘shish</button></div><div class="panel"><h3>Chiqish</h3><p class="muted">Haqiqiy hisobdan chiqish login tizimi ishga tushgach qo‘shiladi.</p><button class="secondary" onclick="alert(\'Hozircha login sessiyasi yo‘q. Ma’lumotlar shu qurilmada saqlanadi.\')">Chiqish</button></div><div class="panel"><h3>Ilova haqida</h3><p>TLO Logistics — kuryerlar va buyurtmalar</p><p>Android sinov versiyasi</p></div>';
m.innerHTML+='<p class="muted tiny">Sinov: ma’lumotlar faqat shu telefonda saqlanadi. Server, login va Telegram hisobotlari hali ulanmagan.</p>'}
render();
</script></body></html>
